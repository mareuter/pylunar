[project]
dynamic = ["version"]
name = "pylunar"
authors = [
    {name = "Michael Reuter", email = "mareuternh@gmail.com"}
]
description = "Information for completing the Astronomical League's Lunar and Lunar II observing programs."
readme = "README.rst"
license = "BSD-3-Clause"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ephem==4.2.1"
]

[project.urls]
Documentation = "http://pylunar.readthedocs.io"
Repository = "https://github.com/mareuter/pylunar"

[dependency-groups]
dev = [
    "scriv",
    { include-group = "build" },
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "tox" },
]
build = [
    "twine",
]
docs = [
    "sphinx",
    "sphinx_rtd_theme"
]
lint = [
    "prek!=0.4.2",
]
test = [
    "coverage[toml]",
    "pytest"
]
tox = [
    "tox",
    "tox-uv-bare>=1.36.0",
]

[build-system]
requires = [
    "setuptools>=64",
    "setuptools_scm>=8",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.mypy]
ignore_missing_imports = true

[tool.numpydoc_validation]
checks = [
    "all",   # report on all checks, except the below
    "EX01",
    "SA01",
    "ES01",
    "GL01",
    "SS05"
]
exclude = [
    "test_*",
    "__init__",
    "conf",
    "startup"
]

[tool.ruff]
exclude = [
    "docs/**",
    "scripts/startup.py"
]
lint.ignore = [
    "D104"
]
lint.select = [
    "B",
    "D",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
    "W"
]
line-length = 110

[tool.ruff.lint.per-file-ignores]
"src/pylunar/__init__.py" = [
    "E402",
    "F401",
    "F403"
]
"tests/**" = [
    "D101",
    "D102",
    "D103",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

[tool.scriv]
entry_title_template = "{{ version }} ({{ date.strftime('%Y-%m-%d') }})"
output_file = "HISTORY.${config:format}"
rst_header_chars = "+^"

[tool.setuptools_scm]


[tool.tox]
requires = ["tox>=4.22"]
env_list = [
    "py",
    "lint",
    "coverage-report",
    "docs",
    "check-packaging"
]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
description = "Setup base environment for {envname}"

[tool.tox.env.py]
description = "Run pytest with coverage"
commands = [["coverage", "run", "-m", "pytest", "--doctest-glob=docs/usage.rst", "{tty:--color=yes}", "{posargs}"]]
dependency_groups = ["test"]

[tool.tox.env.lint]
description = "Lint codebase by running pre-commit."
package = "skip"
commands = [["prek", "run", "--all-files"]]
uv_sync_flags = ["--only-group", "lint"]

[tool.tox.env.coverage-report]
description = "Compile coverage from each test run."
commands = [["coverage", "report"]]
depends = ["py"]
dependency_groups = ["test"]

[tool.tox.env.docs]
description = "Check docs build"
commands = [["make", "docs"]]
allowlist_externals = ["make"]
dependency_groups = ["docs"]

[tool.tox.env.check-packaging]
description = "Check packaging"
commands = [["make", "check-build"]]
allowlist_externals = ["make"]
dependency_groups = ["build", "docs"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
